<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaruLog</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="app-shell">
    <nav class="topbar" aria-label="メインメニュー">
      <a class="brand" href="./">MaruLog</a>
      <div class="topbar-actions">
        <button id="config-toggle" class="nav-button" type="button" aria-expanded="false"
          aria-controls="config-panel">Config</button>
        <button id="theme-toggle" class="nav-button" type="button" aria-label="ダークモード切替">Dark</button>
      </div>
    </nav>

    <main>
      <section class="scoreboard" aria-live="polite">
        <div id="score-total" class="score-total">0〇 0×</div>
        <div class="action-grid">
          <button class="score-button correct" data-action="correct" type="button">〇</button>
          <button class="score-button incorrect" data-action="incorrect" type="button">×</button>
          <button class="score-button through" data-action="through" type="button">スルー</button>
        </div>
        <div class="function-buttons">
          <button id="undo" type="button">↶ Undo</button>
          <button id="reset-data" type="button">Reset</button>
        </div>
        <p id="status-text" class="status-text">READY</p>
      </section>

      <section id="config-panel" class="config-panel" hidden aria-labelledby="config-title">
        <div class="config-heading">
          <h1 id="config-title">Config</h1><span id="save-state">保存済み</span>
        </div>

        <div class="config-block">
          <label class="field">Rule
            <select id="rule-select" aria-label="得点ルール">
              <option value="count">n〇m×</option>
              <option value="ny">NY</option>
              <option value="10by10">10by10</option>
              <option value="7by7">7by7</option>
              <option value="freeze">Freeze</option>
              <option value="custom">S式 custom</option>
            </select>
          </label>
          <div id="rule-settings" class="rule-settings"></div>
          <p id="rule-formula" class="help rule-formula"></p>
        </div>

        <div class="config-block">
          <label class="field">表示形式
            <input id="display-template" type="text" spellcheck="false" aria-label="表示形式">
          </label>
          <p class="help">例: <code>${data[0]}〇${data[1]}×</code>。<code>${data[i]}</code> と <code>${score}</code> が使えます。
          </p>
        </div>

        <div id="custom-hooks" class="config-block">
          <div class="block-heading">
            <h2>Button hooks</h2><button id="reset-hooks" class="small-button" type="button">初期式に戻す</button>
          </div>
          <p class="help"><code>$correct</code> / <code>$incorrect</code> はこの端末の〇/×用データ添字です。<code>$i</code> は
            <code>$correct</code> の別名です。
          </p>
          <label class="hook-editor">〇 正解<textarea id="hook-correct" spellcheck="false"></textarea></label>
          <label class="hook-editor">× 不正解<textarea id="hook-incorrect" spellcheck="false"></textarea></label>
          <label class="hook-editor">スルー<textarea id="hook-through" spellcheck="false"></textarea></label>
        </div>

        <div class="config-block">
          <div class="block-heading">
            <h2>data[128..255]</h2><button id="apply-tail" class="small-button" type="button">適用</button>
          </div>
          <p class="help">1行が1要素です。整数または <code>true</code> / <code>false</code> を入力できます。</p>
          <textarea id="data-tail" class="data-editor" spellcheck="false"></textarea>
          <div id="data-error" class="inline-error" role="alert"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>

</html>
